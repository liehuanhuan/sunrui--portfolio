<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Case｜孙瑞 Portfolio</title>
    <link rel="stylesheet" href="./styles.css?v=20260726a" />
  </head>
  <body>
    <header class="site-header" aria-label="案例页导航">
      <a class="brand" href="./index.html">
        <span class="brand-mark">SR</span>
        <span>回到首页</span>
      </a>
      <nav class="nav-links" aria-label="页面导航">

        <a href="./index.html#work">案例</a>
        <a href="./index.html#contact">联系</a>
      </nav>
    </header>

    <main class="case-page">
      <section class="case-hero">
        <div>
          <p id="case-level" class="superline">S LEVEL CASE</p>
          <h1 id="case-title">Case</h1>
          <p id="case-summary" class="case-summary"></p>
        </div>
        <figure class="case-hero-image">
          <img id="case-hero-image" src="" alt="" />
        </figure>
      </section>

      <section class="case-thinking">
        <span>Final Experience</span>
        <p id="case-thinking"></p>
      </section>

      <section class="case-body">
        <aside class="case-meta">
          <span id="case-year"></span>
          <strong id="case-category"></strong>
          <div id="case-keywords" class="case-keywords"></div>
        </aside>
        <div class="case-writing">
          <article>
            <span>Project Brief</span>
            <p id="case-why"></p>
          </article>
          <article>
            <span>Core Concept</span>
            <p id="case-role"></p>
          </article>
          <article>
            <span>Considerations</span>
            <p id="case-value"></p>
          </article>
        </div>
      </section>

      <section class="case-gallery" id="case-gallery" aria-label="真实项目截图"></section>
    </main>

    <script src="./case-data.js?v=20260612m"></script>
